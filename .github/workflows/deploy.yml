name: Desplegar Pelican en GitHub Pages

on:
  push:
    branches: ["main"]  # O "master", según el nombre de tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Configurar Python
        run: uv python install

      - name: Instalar dependencias
        run: uv sync

      - name: Compilar sitio con Pelican
        run: uv run pelican content -s publishconf.py

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4